<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archives</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/banner.css">
<link rel="stylesheet" href="css/archives.css">
</head>
<body class="archives-body">

<div id="page-wrap">

  <!-- ================= BACK TO HOME (this page has no nav bar otherwise) ================= -->
  <a href="index.html" class="win-button archive-home-link">&larr; Home</a>

  <!-- ================= HEADING (reuses existing banner style) ================= -->
  <table class="banner-table" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td class="banner-cell">
        <div class="archive-header">
          <div class="header-stars" aria-hidden="true">
            <span class="star" style="top:12px; left:8%; color:#ffd76e; font-size:38px;">★</span>
            <span class="star" style="top:120px; left:8%; color:#6fe6c4; font-size:38px;">★</span>
            <span class="star" style="top:30px; left:28%; color:#c9a8ff; font-size:38px;">✦</span>
            <span class="star" style="top:160px; left:38%; color:#ff9ecb; font-size:38px;">★</span>
            <span class="star" style="top:20px; left:80%; color:#6fe6c4; font-size:38px;">★</span>
            <span class="star" style="top:170px; left:70%; color:#ffd76e; font-size:38px;">✦</span>
            <span class="star" style="top:15px; left:60%; color:#ffffff; font-size:20px;">★</span>
            <span class="star" style="top:120px; left:88%; color:#c9a8ff; font-size:38px;">★</span>
          </div>
          <h1 class="archive-title">
            <span>A</span><span>R</span><span>C</span><span>H</span><span>I</span><span>V</span><span>E</span><span>S</span>
          </h1>
          <p class="archive-subtitle">Some things that made me say "Wow"</p>
        </div>
      </td>
    </tr>
  </table>

  <!-- ================= NOTES BOARD (populated by archives.js) ================= -->
  <div id="notes-board" class="notes-board">
    <!-- Sticky notes are generated automatically from content/discoveries.md -->
    <!-- No note markup should be added here by hand. -->
  </div>

  <p id="notes-status" class="notes-status"></p>

</div>

<script src="js/archives.js"></script>
</body>
</html>
